<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatlounge - Vintage Modern Arabesque</title>
    
    <!-- Supabase CDN (V2) -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================
           1. Typography Mapping (STRICTLY FROM PROMPT)
           ========================================= */
        @font-face { 
            font-family: 'Thmanyah-Bold'; 
            src: url('https://cdn.jsdelivr.net/gh/morhafali5r-hub/M.F.L@main/MORHAF-Fonts/thmanyah-family/thmanyahserifdisplay-Bold.otf'); 
            font-display: swap; 
        }
        @font-face { 
            font-family: 'Kaswa-Modern'; 
            src: url('https://cdn.jsdelivr.net/gh/morhafali5r-hub/M.F.L@main/MORHAF-Fonts/kaswa/Kaswa-Modern.ttf'); 
            font-display: swap; 
        }
        @font-face { 
            font-family: 'Gali'; 
            src: url('https://cdn.jsdelivr.net/gh/morhafali5r-hub/M.F.L@main/MORHAF-Fonts/gali/Gali.ttf'); 
            font-display: swap; 
        }
        @font-face { 
            font-family: 'Barseem-Mushaqhbat'; 
            src: url('https://cdn.jsdelivr.net/gh/morhafali5r-hub/M.F.L@main/MORHAF-Fonts/barseem/Barseem-Mushaqhbat.otf'); 
            font-display: swap; 
        }

        /* =========================================
           2. Color Palette
           ========================================= */
        :root {
            --bg-grad-1: #f4ecd8;
            --bg-grad-2: #e8dcc4;
            --text-dark: #3e2a14;
            --text-light: #5c3a21;
            --card-bg: #fbf8f1;
            --card-border: #d4c4a8;
            --shadow-color: #324016;
            --accent-green: #4a5d23;
            --accent-red: #8b3a3a;
            --accent-gold: #b08d57;
            
            --bubble-sender: #e3d3b5;
            --bubble-receiver: #fff;
        }

        /* =========================================
           3. Global Reset & Base Styles
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Gali', sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-dark);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        /* Vintage Paper Texture (SVG Noise) */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0;
        }

        /* Ambient Blobs */
        .ambient-blob {
            position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.4; z-index: -1;
            animation: float 20s infinite alternate ease-in-out;
        }
        .blob-1 { width: 400px; height: 400px; background: var(--accent-gold); top: -10%; right: -10%; }
        .blob-2 { width: 500px; height: 500px; background: var(--accent-green); bottom: -20%; left: -10%; animation-delay: -5s; }

        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 60px) scale(1.1); } }

        /* =========================================
           4. App Container (Responsive Desktop & Mobile)
           ========================================= */
        #app {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; z-index: 1; overflow: hidden;
            background: transparent;
        }

        /* Desktop Mode Enhancements */
        @media (min-width: 768px) {
            #app {
                width: 90vw; max-width: 1000px; height: 90vh;
                background: var(--card-bg);
                border: 2px solid var(--card-border);
                border-radius: 16px;
                box-shadow: 0 20px 50px rgba(0,0,0,0.1), inset 0 2px 4px rgba(255,255,255,0.5);
            }
            .chat-body { padding: 40px 10% !important; }
            .message { max-width: 65% !important; font-size: 1.25rem !important; }
            .login-card { width: 400px !important; margin: 0 auto; }
        }

        /* =========================================
           5. UI Elements & Tactile Design System
           ========================================= */
        h1, h2, .title-font { font-family: 'Thmanyah-Bold', serif; }
        
        .card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            padding: 24px;
        }

        .btn {
            font-family: 'Thmanyah-Bold', serif;
            background: var(--accent-green);
            color: #fff;
            border: 2px solid #324016;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 2px 4px 0px var(--shadow-color);
            transition: all 0.1s ease;
            display: inline-flex; justify-content: center; align-items: center; gap: 10px;
            width: 100%;
            letter-spacing: 0.5px;
        }
        .btn:active {
            box-shadow: 0px 0px 0px var(--shadow-color);
            transform: translateY(4px);
        }

        .btn-secondary { background: var(--accent-gold); border-color: #7a5e35; box-shadow: 2px 4px 0px #7a5e35; }
        .btn-secondary:active { box-shadow: 0px 0px 0px #7a5e35; transform: translateY(4px); }

        input {
            font-family: 'Kaswa-Modern', sans-serif;
            width: 100%; padding: 16px;
            border-radius: 8px;
            border: 2px solid var(--card-border);
            background: #fff;
            font-size: 1.2rem;
            color: var(--text-dark);
            outline: none; transition: border-color 0.3s;
            margin-bottom: 16px; text-align: right;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        input:focus { border-color: var(--accent-gold); }

        .hint { font-family: 'Gali', sans-serif; font-size: 1rem; color: var(--text-light); text-align: center; display: block; }
        
        .error-msg {
            font-family: 'Gali', sans-serif;
            background: var(--accent-red); color: #fff;
            padding: 10px; border-radius: 8px; font-size: 1rem;
            margin-bottom: 16px; text-align: center; display: none;
            box-shadow: 2px 4px 0px #5a1f1f;
        }

        /* Animations */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
        .shake { animation: shake 0.4s both; }
        @keyframes popIn { 0% { transform: scale(0.9) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }

        /* =========================================
           6. Screens Layouts
           ========================================= */
        /* Login Screen */
        #login-screen {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 24px; text-align: center;
        }
        #login-screen h1 { font-size: 4rem; color: var(--accent-green); margin-bottom: 8px; text-shadow: 1px 2px 0px var(--card-border); }
        .login-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 8px; }

        /* Chat Screen */
        #chat-screen { display: none; flex-direction: column; height: 100%; position: relative; background: var(--bg-grad-1); }
        
        .chat-header {
            padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); border-bottom: 2px solid var(--card-border); z-index: 10;
        }
        
        .room-title-display { font-family: 'Barseem-Mushaqhbat', serif; font-size: 2.2rem; color: var(--accent-gold); margin: 0; direction: ltr;}
        
        .copy-btn {
            background: #fff; border: 2px solid var(--card-border); border-radius: 6px; padding: 6px 12px;
            cursor: pointer; display: flex; justify-content: center; align-items: center; color: var(--accent-gold);
            font-family: 'Gali', sans-serif; font-size: 0.9rem; transition: all 0.1s; box-shadow: 1px 2px 0px var(--card-border);
        }
        .copy-btn:active { transform: translateY(2px); box-shadow: 0px 0px 0px var(--card-border); }
        
        .online-status { font-family: 'Gali', sans-serif; font-size: 0.95rem; color: var(--text-light); display: flex; align-items: center; gap: 6px; margin-top: 4px;}
        .online-dot { width: 12px; height: 12px; background: #4caf50; border-radius: 50%; box-shadow: 0 0 6px rgba(76, 175, 80, 0.5); border: 2px solid #fff;}

        /* Chat Body */
        .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .chat-body::-webkit-scrollbar { width: 8px; }
        .chat-body::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

        /* Messages */
        .message {
            max-width: 85%; padding: 12px 16px; border-radius: 8px;
            font-family: 'Kaswa-Modern', sans-serif; font-size: 1.2rem; line-height: 1.5;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative; word-wrap: break-word; border: 2px solid var(--card-border);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.05);
        }
        .msg-sender { align-self: flex-start; background: var(--bubble-sender); border-bottom-right-radius: 0; }
        .msg-receiver { align-self: flex-end; background: var(--bubble-receiver); border-bottom-left-radius: 0; }
        
        .msg-author { font-family: 'Gali', sans-serif; font-size: 0.85rem; color: var(--text-light); margin-bottom: 6px; display: block; font-weight: bold; }
        .msg-image { max-width: 100%; border-radius: 4px; margin-top: 8px; border: 1px solid var(--card-border); }
        .msg-audio { width: 100%; max-width: 250px; height: 40px; margin-top: 8px; outline: none; }

        .msg-game-invite { background: var(--accent-gold); color: #fff; text-align: center; align-self: center !important; max-width: 90% !important; border-color: #8f6e3c; }
        
        /* Chat Footer */
        .chat-footer {
            padding: 16px; border-top: 2px solid var(--card-border); display: flex; align-items: center; gap: 8px;
            background: var(--card-bg); z-index: 10;
        }
        #chat-input { margin-bottom: 0; border-radius: 8px; height: 55px; }

        .icon-btn {
            background: none; border: none; color: var(--accent-green); cursor: pointer; padding: 8px; transition: transform 0.1s;
            display: flex; justify-content: center; align-items: center;
        }
        .icon-btn:active { transform: scale(0.85); }
        .icon-btn.recording { color: var(--accent-red); animation: pulseRecord 1s infinite; }
        @keyframes pulseRecord { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #send-btn {
            background: var(--accent-green); color: #fff; width: 55px; height: 55px;
            border-radius: 8px; border: 2px solid #324016; display: flex; justify-content: center; align-items: center;
            box-shadow: 2px 4px 0px var(--shadow-color); cursor: pointer; transition: all 0.1s; flex-shrink: 0;
        }
        #send-btn:active { box-shadow: 0px 0px 0px var(--shadow-color); transform: translateY(4px); }
        #send-btn svg { width: 26px; height: 26px; fill: currentColor; transform: rotate(180deg); }

        /* =========================================
           7. Arcade Panel & Games
           ========================================= */
        #arcade-panel {
            position: absolute; top: 0; right: 100%; width: 85%; max-width: 350px; height: 100%;
            background: var(--card-bg); border-right: 2px solid var(--card-border);
            box-shadow: 10px 0 30px rgba(0,0,0,0.1); z-index: 20;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 24px; display: flex; flex-direction: column; gap: 16px;
        }
        #arcade-panel.open { transform: translateX(100%); }
        
        .game-card { background: #fff; border: 2px solid var(--card-border); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; box-shadow: 2px 4px 0px var(--card-border); transition: all 0.1s; }
        .game-card:active { transform: translateY(4px); box-shadow: 0px 0px 0px var(--card-border); }
        .game-card h3 { font-family: 'Thmanyah-Bold', serif; color: var(--accent-green); margin-bottom: 4px; font-size: 1.5rem;}
        
        .leaderboard { margin-top: auto; padding-top: 16px; border-top: 2px dashed var(--card-border); }
        .leaderboard h4 { font-family: 'Thmanyah-Bold', serif; color: var(--text-dark); margin-bottom: 12px; font-size: 1.4rem;}
        .leaderboard-list { font-family: 'Kaswa-Modern', sans-serif; font-size: 1.1rem; list-style: none; }
        .leaderboard-list li { display: flex; justify-content: space-between; margin-bottom: 8px; padding: 10px; background: #fff; border: 2px solid var(--card-border); border-radius: 8px; box-shadow: 1px 2px 0px var(--card-border);}

        /* XO Game Modal */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(62, 42, 20, 0.8); display: none; justify-content: center; align-items: center; z-index: 30;
        }
        .modal-overlay.active { display: flex; }
        
        .game-modal { width: 90%; max-width: 380px; text-align: center; position: relative; }
        
        .xo-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px auto; width: 280px; height: 280px; }
        .xo-cell {
            background: #fff; border: 2px solid var(--card-border); border-radius: 8px;
            font-family: 'Barseem-Mushaqhbat', serif; font-size: 4rem; display: flex; justify-content: center; align-items: center;
            color: var(--text-dark); cursor: pointer; box-shadow: 2px 4px 0px var(--card-border); transition: all 0.1s;
        }
        .xo-cell:active { box-shadow: 0px 0px 0px var(--card-border); transform: translateY(4px); }
        .xo-cell.x-mark { color: var(--accent-red); }
        .xo-cell.o-mark { color: var(--accent-green); }
        
        #xo-status { font-family: 'Kaswa-Modern', sans-serif; font-size: 1.4rem; color: var(--text-dark); margin-bottom: 12px; }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <div id="app">
        <!-- 1. LOGIN SCREEN -->
        <div id="login-screen">
            <h1>Chatlounge</h1>
            <span class="hint" style="font-family: 'Panorama-Naskh', serif; font-size: 1.2rem; margin-bottom: 32px;">غرفة المحادثة العصرية بالأجواء الكلاسيكية</span>
            
            <div class="card login-card">
                <div id="auth-error" class="error-msg"></div>

                <!-- إزالة حقل الرقم بالكامل. فقط الاسم -->
                <input type="text" id="username" placeholder="أدخل اسمك المستعار..." autocomplete="off">
                
                <button class="btn" id="btn-create">إنشاء غرفة جديدة</button>
                
                <div style="display: flex; gap: 8px; margin-top: 16px; align-items: stretch;">
                    <input type="text" id="room-id" placeholder="رمز الغرفة (للانضمام)" autocomplete="off" style="margin-bottom: 0; flex: 1;">
                    <button class="btn btn-secondary" id="btn-join" style="width: auto; padding: 0 20px;">دخول</button>
                </div>
            </div>
        </div>

        <!-- 2. CHAT SCREEN -->
        <div id="chat-screen">
            <div class="chat-header">
                <button class="icon-btn" id="btn-arcade" title="صالة الألعاب">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                </button>
                
                <div style="display: flex; flex-direction: column; align-items: flex-end;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <h2 class="room-title-display" id="display-room-id">ROOM</h2>
                        <button class="copy-btn" id="btn-copy-id">نسخ الرمز</button>
                    </div>
                    <div class="online-status">
                        <div class="online-dot"></div><span id="online-count">جاري الاتصال...</span>
                    </div>
                </div>
            </div>

            <div class="chat-body" id="chat-body">
                <!-- Messages go here -->
            </div>

            <div class="chat-footer">
                <button class="icon-btn" id="btn-attach"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
                <input type="file" id="file-input" accept="image/*">
                
                <input type="text" id="chat-input" placeholder="اكتب رسالتك..." autocomplete="off" style="flex: 1;">
                
                <button class="icon-btn" id="btn-mic"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
                <button id="send-btn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
            </div>
        </div>

        <!-- 3. ARCADE PANEL -->
        <div id="arcade-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 class="title-font" style="color: var(--accent-gold); font-size: 2.2rem;">صالة الألعاب</h2>
                <button class="icon-btn" id="btn-close-arcade"><svg viewBox="0 0 24 24" width="32" height="32" fill="var(--text-dark)"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
            </div>
            
            <div class="game-card" id="btn-play-xo">
                <h3>تيك تاك تو (XO)</h3>
                <span class="hint">تحدى الأصدقاء الآن</span>
            </div>
            <div class="game-card" style="opacity: 0.6;">
                <h3>خمنها (قريباً)</h3>
                <span class="hint">لعبة الكلمات العربية</span>
            </div>

            <div class="leaderboard">
                <h4>لوحة الشرف (XO)</h4>
                <ul class="leaderboard-list" id="leaderboard-list"></ul>
            </div>
        </div>

        <!-- 4. GAME MODAL -->
        <div class="modal-overlay" id="xo-modal-overlay">
            <div class="card game-modal">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h2 class="title-font" style="color: var(--accent-green); font-size: 2.2rem;">تيك تاك تو</h2>
                    <button class="btn btn-secondary" id="btn-close-xo" style="width:auto; padding: 8px 16px; font-size:1rem;">إغلاق</button>
                </div>
                
                <div id="xo-status">بانتظار الخصم...</div>
                <div class="xo-board" id="xo-board">
                    <div class="xo-cell" data-index="0"></div><div class="xo-cell" data-index="1"></div><div class="xo-cell" data-index="2"></div>
                    <div class="xo-cell" data-index="3"></div><div class="xo-cell" data-index="4"></div><div class="xo-cell" data-index="5"></div>
                    <div class="xo-cell" data-index="6"></div><div class="xo-cell" data-index="7"></div><div class="xo-cell" data-index="8"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        /**
         * ==============================================================================
         * VANILLA JS LOGIC - CRASH PROOF, NO PHONE NUMBER, STRICT DESIGN SYSTEM
         * ==============================================================================
         */
        window.addEventListener('DOMContentLoaded', () => {

            // 1. Supabase Init with Crash Protection
            const SUPABASE_URL = 'https://nutglcvfbkbzydtboquf.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51dGdsY3ZmYmtienlkdGJvcXVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjM5NzAsImV4cCI6MjEwMjg5OTk3MH0.iTBmetqtbVWWm73q8V28bYY7ZoEWZLvNaNWVEmJgL54';
            let supabaseClient = null;

            try {
                if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } catch(e) { console.error("Supabase failed to load", e); }

            // 2. Application State
            const state = {
                username: '', roomId: '', channel: null, onlineUsers: new Map(),
                scores: JSON.parse(localStorage.getItem('chatlounge_scores')) || {},
                xo: { active: false, board: Array(9).fill(null), turn: 'X', mySymbol: null, opponentSymbol: null, playerX: null, playerO: null },
                isRecording: false, mediaRecorder: null, audioChunks: []
            };

            // 3. Audio & Haptics Engine
            class AudioHaptics {
                constructor() { this.ctx = null; this.ready = false; }
                init() {
                    if(!this.ready) {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if(AC) { this.ctx = new AC(); this.ready = true; }
                    }
                    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
                }
                vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
                play(type) {
                    if (!this.ctx) return;
                    try {
                        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                        osc.connect(gain); gain.connect(this.ctx.destination); const now = this.ctx.currentTime;
                        if(type === 'pop') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(800, now+0.1); gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.1); osc.start(now); osc.stop(now+0.1); }
                        else if(type === 'bloop') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(300, now+0.15); gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.15); osc.start(now); osc.stop(now+0.15); }
                        else if(type === 'error') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.3); osc.start(now); osc.stop(now+0.3); }
                        else if(type === 'win') { osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554, now+0.1); osc.frequency.setValueAtTime(659, now+0.2); gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0, now+0.5); osc.start(now); osc.stop(now+0.5); }
                    } catch(e) {}
                }
            }
            const fx = new AudioHaptics();

            // DOM Elements
            const UI = {
                err: document.getElementById('auth-error'), user: document.getElementById('username'), roomIn: document.getElementById('room-id'),
                btnCreate: document.getElementById('btn-create'), btnJoin: document.getElementById('btn-join'),
                loginScreen: document.getElementById('login-screen'), chatScreen: document.getElementById('chat-screen'),
                roomTitle: document.getElementById('display-room-id'), copyBtn: document.getElementById('btn-copy-id'),
                chatBody: document.getElementById('chat-body'), chatIn: document.getElementById('chat-input'),
                btnSend: document.getElementById('send-btn'), btnMic: document.getElementById('btn-mic'),
                btnAttach: document.getElementById('btn-attach'), fileIn: document.getElementById('file-input'),
                onlineCount: document.getElementById('online-count'), arcadePanel: document.getElementById('arcade-panel'),
                btnArcade: document.getElementById('btn-arcade'), btnCloseArcade: document.getElementById('btn-close-arcade'),
                btnXO: document.getElementById('btn-play-xo'), xoModal: document.getElementById('xo-modal-overlay'),
                btnCloseXO: document.getElementById('btn-close-xo'), xoCells: document.querySelectorAll('.xo-cell'),
                xoStatus: document.getElementById('xo-status'), leaderboardList: document.getElementById('leaderboard-list')
            };

            // 4. Auth & Entry (NO PHONE NUMBER)
            function showError(msg) {
                UI.err.textContent = msg; UI.err.style.display = 'block';
                fx.play('error'); fx.vibrate([30,50,30]);
                UI.user.classList.remove('shake'); void UI.user.offsetWidth; UI.user.classList.add('shake');
            }

            function validateAuth() {
                fx.init(); UI.err.style.display = 'none';
                if(!supabaseClient) { showError("لا يمكن الاتصال بالمخدمات! يرجى تشغيل (VPN)."); return false; }
                const u = UI.user.value.trim();
                if(!u) { showError("يرجى إدخال اسمك المستعار للدخول."); return false; }
                state.username = u; return true;
            }

            UI.btnCreate.addEventListener('click', () => {
                if(validateAuth()) {
                    fx.vibrate([15]); state.roomId = Math.random().toString(36).substring(2,8).toUpperCase();
                    enterRoom();
                }
            });

            UI.btnJoin.addEventListener('click', () => {
                if(validateAuth()) {
                    const r = UI.roomIn.value.trim().toUpperCase();
                    if(r.length >= 4) { fx.vibrate([15]); state.roomId = r; enterRoom(); }
                    else showError("رمز الغرفة غير صحيح.");
                }
            });

            UI.copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(state.roomId).then(() => {
                    fx.vibrate([15]); UI.copyBtn.textContent = 'تم النسخ!';
                    setTimeout(() => UI.copyBtn.textContent = 'نسخ الرمز', 2000);
                });
            });

            // 5. Room Entry & Realtime Setup
            function enterRoom() {
                UI.loginScreen.style.display = 'none'; UI.chatScreen.style.display = 'flex';
                UI.roomTitle.textContent = state.roomId;
                renderLeaderboard();
                setupChannel();
            }

            function setupChannel() {
                state.channel = supabaseClient.channel(`room_${state.roomId}`, {
                    config: { presence: { key: state.username }, broadcast: { self: false } }
                });

                state.channel.on('presence', { event: 'sync' }, () => {
                    state.onlineUsers.clear();
                    const p = state.channel.presenceState();
                    for (const k in p) state.onlineUsers.set(k, p[k][0]);
                    UI.onlineCount.textContent = `${state.onlineUsers.size} متصل`;
                });

                state.channel.on('broadcast', { event: 'chat' }, (p) => { fx.play('bloop'); fx.vibrate([30,30]); renderMsg(p.payload, false); });
                state.channel.on('broadcast', { event: 'game' }, (p) => renderInvite(p.payload.game, p.payload.user));
                state.channel.on('broadcast', { event: 'xo' }, (p) => handleXOAction(p.payload));

                state.channel.subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await state.channel.track({ user: state.username, time: Date.now() });
                        sysMsg(`مرحباً ${state.username} في الغرفة!`);
                    }
                });
            }

            // 6. Messaging Logic
            function sendMsg() {
                const text = UI.chatIn.value.trim(); if(!text) return;
                const m = { type: 'text', content: text, author: state.username };
                renderMsg(m, true); if(state.channel) state.channel.send({ type: 'broadcast', event: 'chat', payload: m });
                UI.chatIn.value = ''; fx.play('pop'); fx.vibrate([15]);
            }
            UI.btnSend.addEventListener('click', sendMsg);
            UI.chatIn.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMsg(); });

            function renderMsg(m, isMine) {
                const div = document.createElement('div'); div.className = `message ${isMine ? 'msg-sender' : 'msg-receiver'}`;
                const author = `<span class="msg-author">${isMine ? 'أنت' : m.author}</span>`;
                
                if (m.type === 'text') {
                    const safeText = m.content.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]));
                    div.innerHTML = `${author}${safeText}`;
                } else if (m.type === 'image') {
                    div.innerHTML = `${author}<img src="${m.url}" class="msg-image" onload="document.getElementById('chat-body').scrollTop=1e5">`;
                } else if (m.type === 'audio') {
                    div.innerHTML = `${author}<audio src="${m.url}" controls class="msg-audio"></audio>`;
                }
                UI.chatBody.appendChild(div); UI.chatBody.scrollTop = UI.chatBody.scrollHeight;
            }

            function sysMsg(txt) {
                const div = document.createElement('div'); div.className = 'hint'; div.textContent = txt;
                UI.chatBody.appendChild(div); UI.chatBody.scrollTop = UI.chatBody.scrollHeight;
            }

            // 7. Media (Images & Audio via Supabase Storage)
            async function upload(file, ext, folder) {
                try {
                    const name = `${folder}/${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
                    const { error } = await supabaseClient.storage.from('chatlounge').upload(name, file);
                    if(error) throw error;
                    return supabaseClient.storage.from('chatlounge').getPublicUrl(name).data.publicUrl;
                } catch(e) { sysMsg("فشل الرفع. تأكد من إعدادات مساحة التخزين."); return null; }
            }

            UI.btnAttach.addEventListener('click', () => { fx.vibrate([15]); UI.fileIn.click(); });
            UI.fileIn.addEventListener('change', async (e) => {
                const file = e.target.files[0]; if(!file) return;
                sysMsg("جاري إرسال الصورة...");
                const url = await upload(file, file.name.split('.').pop(), 'images');
                if(url) {
                    const m = { type: 'image', url, author: state.username };
                    renderMsg(m, true); state.channel.send({ type: 'broadcast', event: 'chat', payload: m }); fx.play('pop');
                }
            });

            UI.btnMic.addEventListener('click', async () => {
                fx.vibrate([15]);
                if(state.isRecording) {
                    state.mediaRecorder.stop(); UI.btnMic.classList.remove('recording'); state.isRecording = false;
                } else {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        state.mediaRecorder = new MediaRecorder(stream); state.audioChunks = [];
                        state.mediaRecorder.ondataavailable = e => { if(e.data.size > 0) state.audioChunks.push(e.data); };
                        state.mediaRecorder.onstop = async () => {
                            const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
                            stream.getTracks().forEach(t => t.stop()); sysMsg("جاري إرسال المقطع...");
                            const url = await upload(blob, 'webm', 'audio');
                            if(url) {
                                const m = { type: 'audio', url, author: state.username };
                                renderMsg(m, true); state.channel.send({ type: 'broadcast', event: 'chat', payload: m }); fx.play('pop');
                            }
                        };
                        state.mediaRecorder.start(); UI.btnMic.classList.add('recording'); state.isRecording = true;
                    } catch(err) { sysMsg("لا يمكن الوصول للميكروفون."); }
                }
            });

            // 8. Arcade & Tic-Tac-Toe Sync
            UI.btnArcade.addEventListener('click', () => { fx.vibrate([15]); UI.arcadePanel.classList.add('open'); });
            UI.btnCloseArcade.addEventListener('click', () => { fx.vibrate([15]); UI.arcadePanel.classList.remove('open'); });

            UI.btnXO.addEventListener('click', () => {
                fx.vibrate([15]); UI.arcadePanel.classList.remove('open');
                state.channel.send({ type: 'broadcast', event: 'game', payload: { game: 'XO', user: state.username } });
                renderInvite('XO', state.username);
            });

            function renderInvite(game, inviter) {
                const div = document.createElement('div'); div.className = 'message msg-game-invite';
                const isMe = inviter === state.username;
                div.innerHTML = `
                    <div style="font-family:'Kaswa-Modern', sans-serif; font-size:1.2rem; margin-bottom:8px;">${isMe ? `أرسلت دعوة للعب ${game}` : `🎮 ${inviter} يتحداك في ${game}`}</div>
                    <button class="btn" style="background:#fff; color:var(--text-dark); border:2px solid var(--text-dark); box-shadow:2px 4px 0px var(--text-dark); padding:8px; font-size:1rem;">
                        ${isMe ? 'انتظار...' : 'قبول التحدي'}
                    </button>
                `;
                div.querySelector('button').addEventListener('click', () => {
                    fx.vibrate([15]);
                    if(!isMe) {
                        state.channel.send({ type: 'broadcast', event: 'xo', payload: { action: 'start', pX: inviter, pO: state.username } });
                        openXO('O', inviter, state.username);
                    } else openXO('X', state.username, null);
                });
                UI.chatBody.appendChild(div); UI.chatBody.scrollTop = UI.chatBody.scrollHeight;
            }

            function handleXOAction(p) {
                if (p.action === 'start' && (p.pX === state.username || p.pO === state.username)) {
                    openXO(p.pX === state.username ? 'X' : 'O', p.pX, p.pO);
                } else if (p.action === 'move') {
                    updateXO(p.i, p.s); checkWin();
                } else if (p.action === 'rematch') {
                    resetXO();
                }
            }

            function openXO(mySym, pX, pO) {
                state.xo = { active: true, board: Array(9).fill(null), turn: 'X', mySymbol: mySym, pX, pO };
                resetXO(); UI.xoModal.classList.add('active'); updateXOStatus();
                fx.play('pop'); fx.vibrate([30,30]);
            }

            UI.btnCloseXO.addEventListener('click', () => { UI.xoModal.classList.remove('active'); state.xo.active = false; fx.vibrate([15]); });

            function resetXO() {
                state.xo.board.fill(null); state.xo.turn = 'X';
                UI.xoCells.forEach(c => { c.textContent = ''; c.className = 'xo-cell'; });
                updateXOStatus();
            }

            UI.xoCells.forEach(c => c.addEventListener('click', (e) => {
                if(!state.xo.active) return;
                const i = e.target.getAttribute('data-index');
                if(state.xo.turn === state.xo.mySymbol && !state.xo.board[i]) {
                    fx.vibrate([15]); updateXO(i, state.xo.mySymbol);
                    state.channel.send({ type: 'broadcast', event: 'xo', payload: { action: 'move', i, s: state.xo.mySymbol } });
                    checkWin();
                }
            }));

            function updateXO(i, s) {
                state.xo.board[i] = s; const cell = document.querySelector(`.xo-cell[data-index="${i}"]`);
                cell.textContent = s; cell.classList.add(s === 'X' ? 'x-mark' : 'o-mark');
                state.xo.turn = s === 'X' ? 'O' : 'X'; updateXOStatus(); fx.play('pop');
            }

            function updateXOStatus() {
                if(!state.xo.active) return;
                const myTurn = state.xo.turn === state.xo.mySymbol;
                UI.xoStatus.textContent = myTurn ? "دورك الآن!" : "دور الخصم...";
                UI.xoStatus.style.color = myTurn ? "var(--accent-green)" : "var(--text-light)";
            }

            function checkWin() {
                const b = state.xo.board, w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                let win = null; for(let p of w) if(b[p[0]] && b[p[0]]===b[p[1]] && b[p[1]]===b[p[2]]) win = b[p[0]];

                if(win) {
                    state.xo.active = false; const isMe = win === state.xo.mySymbol;
                    UI.xoStatus.textContent = isMe ? "🎉 فزت!" : "خسرت!";
                    UI.xoStatus.style.color = isMe ? "var(--accent-green)" : "var(--accent-red)";
                    if(isMe) { fx.play('win'); fx.vibrate([50,50,50]); saveScore(state.username); }
                    else fx.play('error');
                    
                    setTimeout(() => {
                        if(confirm("مباراة جديدة؟")) { state.channel.send({ type: 'broadcast', event: 'xo', payload: { action: 'rematch' } }); resetXO(); state.xo.active=true; }
                        else UI.xoModal.classList.remove('active');
                    }, 2000);
                } else if(!b.includes(null)) {
                    state.xo.active = false; UI.xoStatus.textContent = "تعادل!"; UI.xoStatus.style.color = "var(--text-dark)"; fx.play('bloop');
                    setTimeout(() => UI.xoModal.classList.remove('active'), 2000);
                }
            }

            // 9. Leaderboard (LocalStorage)
            function saveScore(user) {
                if(!state.scores[user]) state.scores[user] = 0;
                state.scores[user]++;
                localStorage.setItem('chatlounge_scores', JSON.stringify(state.scores));
                renderLeaderboard();
            }

            function renderLeaderboard() {
                UI.leaderboardList.innerHTML = '';
                const sorted = Object.entries(state.scores).sort((a,b) => b[1] - a[1]);
                if(sorted.length === 0) UI.leaderboardList.innerHTML = '<li style="justify-content:center; color:#888;">لا توجد نقاط</li>';
                sorted.forEach(([n, s]) => { UI.leaderboardList.innerHTML += `<li><span>${n}</span> <strong>${s} فوز</strong></li>`; });
            }
        });
    </script>
</body>
</html>
